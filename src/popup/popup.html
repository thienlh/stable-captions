<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stable Captions</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <main class="popup">
    <header class="title">
      <h1><a id="home" href="https://stable.monster" target="_blank" rel="noopener"><span class="lift">Stable Captions</span></a></h1>
      <!-- The TV is the power switch: click it to switch Stable Captions off or on. -->
      <button class="status" id="status" role="switch" aria-checked="true" aria-label="Stable Captions"
        aria-describedby="status-text" data-state="idle">
        <span id="status-text"></span>
        <span class="tv lift" aria-hidden="true">
          <svg viewBox="0 0 42 38">
            <path class="ln" d="M21 10 13.5 2.5M21 10l7-6.5M10 34.2 8.5 37M32 34.2l1.5 2.8"/>
            <circle class="ink" cx="13" cy="2.2" r="1.6"/><circle class="ink" cx="28.4" cy="3.2" r="1.6"/>
            <rect class="body" x="2" y="10" width="38" height="24" rx="6"/>
            <rect class="tube" x="6" y="13.5" width="24" height="17" rx="4"/>
            <g class="screen">
              <rect class="glass" x="6" y="13.5" width="24" height="17" rx="4"/>
              <rect class="word w1" x="9" y="24.2" width="10" height="2.6" rx="1.3"/>
              <rect class="word w2" x="20.2" y="24.2" width="6.5" height="2.6" rx="1.3"/>
            </g>
            <path class="shine" d="M8.5 16.5c1.5-.9 3.2-1.2 5-1"/>
            <circle class="knob" cx="35" cy="18" r="2"/>
            <path class="ln thin" d="M33.2 24.5h3.6M33.2 27.5h3.6"/>
          </svg>
        </span>
      </button>
    </header>
    <!-- Below the header, so the TV (the power switch) stays while access is missing. -->
    <button class="grant" id="grant" hidden>Allow video sites</button>

    <section class="cards" aria-label="Caption style" data-needs-on>
      <button class="style-card" data-style="frosted" aria-pressed="false">
        <div class="pv" data-preview="frosted"></div>
        <span class="sc-name"><b>Frosted</b><small>calm</small></span>
        <i class="sticker" aria-hidden="true">picked!</i>
      </button>
      <button class="style-card" data-style="tiktok" aria-pressed="false">
        <div class="pv" data-preview="tiktok"></div>
        <span class="sc-name"><b>Short</b><small>fun</small></span>
        <i class="sticker" aria-hidden="true">picked!</i>
      </button>
      <button class="style-card" data-style="boring" aria-pressed="false">
        <div class="pv" data-preview="boring"></div>
        <span class="sc-name"><b>Boring</b><small>accessible</small></span>
        <i class="sticker" aria-hidden="true">picked!</i>
      </button>
    </section>

    <section class="group" data-needs-on>
      <div class="row">
        <div class="label">
          <div class="name">Text size <kbd>− +</kbd></div>
          <output class="hint" id="size-label"></output>
        </div>
        <div class="stepper">
          <button class="step" data-size-step="-1" aria-label="Smaller text"><span class="lift">−</span></button>
          <span class="bars" id="size-dots" aria-hidden="true"></span>
          <button class="step" data-size-step="1" aria-label="Larger text"><span class="lift">+</span></button>
        </div>
      </div>

      <div class="row stack">
        <div class="name"><span id="window-title"></span> <kbd>W</kbd></div>
        <div class="seg" id="window-list" role="group" aria-labelledby="window-title"></div>
      </div>

      <div class="row">
        <div class="label">
          <div class="name" id="highlight-label">Highlight words <kbd>H</kbd></div>
          <div class="hint" id="highlight-hint"></div>
        </div>
        <div class="controls">
          <!-- Short's highlight colour, Safari only (popup.js shows it): two dots
               beside the switch, while Short is picked and the highlight is on. -->
          <div class="swatches" id="tiktok-color" role="radiogroup" aria-label="Highlight colour" hidden>
            <button class="swatch" data-tiktok-color="pink" role="radio" aria-checked="true"></button>
            <button class="swatch" data-tiktok-color="yellow" role="radio" aria-checked="false"></button>
          </div>
          <button class="switch" id="highlight" role="switch" aria-checked="true" aria-labelledby="highlight-label"></button>
        </div>
      </div>

      <div class="row">
        <div class="label">
          <div class="name" id="clean-label">Clean verbatim <kbd>⇧C</kbd></div>
          <div class="hint" id="clean-hint"></div>
        </div>
        <div class="controls">
          <!-- How clean, two soap dots beside the switch while clean verbatim is on (popup.js):
               one sparkle hides fillers and stumbles; squeaky clean (a sparkle cluster
               and a bubble) also hides [sound tags]. -->
          <div class="swatches" id="clean-level" role="radiogroup" aria-label="How clean" hidden>
            <button class="swatch level" data-clean-level="light" role="radio" aria-checked="true"
              title="Clean: no um, uh or stumbles" aria-label="Clean">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <g transform="translate(4.5 4.5) scale(.625)"><path class="spark s1" d="M12 1.5c.7 5.6 3.4 9.3 10.5 10.5-7.1 1.2-9.8 4.9-10.5 10.5C11.3 16.9 8.6 13.2 1.5 12 8.6 10.8 11.3 7.1 12 1.5Z"/></g>
              </svg>
            </button>
            <button class="swatch level" data-clean-level="strict" role="radio" aria-checked="false"
              title="Squeaky clean: no [Applause] or [Music] either" aria-label="Squeaky clean">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle class="bubble" cx="8" cy="16.5" r="2.6"/>
                <g transform="translate(7.5 2.5) scale(.55)"><path class="spark s1" d="M12 1.5c.7 5.6 3.4 9.3 10.5 10.5-7.1 1.2-9.8 4.9-10.5 10.5C11.3 16.9 8.6 13.2 1.5 12 8.6 10.8 11.3 7.1 12 1.5Z"/></g>
                <g transform="translate(2.9 3.4) scale(.26)"><path class="spark s2" d="M12 1.5c.7 5.6 3.4 9.3 10.5 10.5-7.1 1.2-9.8 4.9-10.5 10.5C11.3 16.9 8.6 13.2 1.5 12 8.6 10.8 11.3 7.1 12 1.5Z"/></g>
                <g transform="translate(14.6 14.6) scale(.24)"><path class="spark s3" d="M12 1.5c.7 5.6 3.4 9.3 10.5 10.5-7.1 1.2-9.8 4.9-10.5 10.5C11.3 16.9 8.6 13.2 1.5 12 8.6 10.8 11.3 7.1 12 1.5Z"/></g>
              </svg>
            </button>
          </div>
          <button class="switch" id="clean" role="switch" aria-checked="false" aria-labelledby="clean-label"></button>
        </div>
      </div>
    </section>

    <footer class="keys" aria-label="Keyboard shortcuts on the video" data-needs-on>
      <span><kbd>C</kbd> captions on/off</span>
      <span><kbd>⌥C</kbd> switch style</span>
      <span data-language-hint title="Starts with your browser language. A language you pick in YouTube's subtitles menu replaces it."><kbd>⇧L</kbd> original ↔ preferred language</span>
      <span title="Move captions up (⇧K) or down (⇧J), e.g. off subtitles in the video. For the current video only; never saved."><kbd>⇧K</kbd><kbd>⇧J</kbd> move captions</span>
    </footer>
  </main>

  <script src="../core/settings.js"></script>
  <script src="../core/language-preference.js"></script>
  <script src="popup.js"></script>
  <script src="../vendor/paper-shaders.js"></script>
  <script src="backdrop.js"></script>
</body>
</html>
